# fly.toml app configuration file generated for shipmd on 2026-11-13T13:37:47Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'shipmd'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  BOARD_DB = '/data/board.db'
  PORT = '8080'
  RUST_LOG = 'info,sqlx=warn'
  STATIC_DIR = '/app/static'

[[mounts]]
  source = 'shipmd_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
